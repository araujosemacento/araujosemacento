name: Update readme

on:
  push:
    branches:
      - main
      - refactor
    paths-ignore:
      - 'README.md'
      - 'output.gif'
      - 'github-contribution-grid-snake.gif'
      - 'github-contribution-grid-snake-dark.gif'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y ffmpeg
          python -m pip install --upgrade pip
          pip install git+https://github.com/x0rzavi/github-readme-terminal.git@main

      - name: Run script
        run: python main.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GIFOS_GENERAL_FPS: 20
          GIFOS_GENERAL_LOOP_COUNT: 1
          GIFOS_GENERAL_COLOR_SCHEME: "dracula"

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.gif
            github-contribution-grid-snake-dark.gif?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update readme
        run: |
          git add README.md output.gif github-contribution-grid-snake.gif github-contribution-grid-snake-dark.gif
          git -c "user.name=github-actions[bot]" -c "user.email=41898282+github-actions[bot]@users.noreply.github.com" commit -m "Automatically updated on $(TZ='America/Fortaleza' date)" || echo "No changes to commit"
          git push
